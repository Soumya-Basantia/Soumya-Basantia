<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 450" width="100%" height="450" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Neon Glow Filter -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f5ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091329" />
      <stop offset="50%" stop-color="#060b17" />
      <stop offset="100%" stop-color="#030610" />
    </linearGradient>

    <style>
      .matrix-char {
        font-family: 'Fira Code', monospace, Courier;
        font-size: 11px;
        fill: #00f5ff;
        opacity: 0.7;
      }
      
      .scanline {
        animation: scanAnim 3.5s linear infinite;
      }

      @keyframes scanAnim {
        0% { transform: translateY(20px); opacity: 0; }
        15% { opacity: 0.9; }
        85% { opacity: 0.9; }
        100% { transform: translateY(410px); opacity: 0; }
      }

      .matrix-stream-1 { animation: fall 3s linear infinite; }
      .matrix-stream-2 { animation: fall 2.4s linear infinite; animation-delay: 0.7s; }
      .matrix-stream-3 { animation: fall 3.6s linear infinite; animation-delay: 1.2s; }
      .matrix-stream-4 { animation: fall 2.8s linear infinite; animation-delay: 0.3s; }

      @keyframes fall {
        0% { transform: translateY(-50px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(460px); opacity: 0; }
      }

      .neon-sig {
        font-family: 'Brush Script MT', 'Sacramento', cursive;
        font-size: 42px;
        fill: #00f5ff;
        filter: url(#neonCyan);
        animation: pulseGlow 2.5s ease-in-out infinite alternate;
      }

      @keyframes pulseGlow {
        0% { filter: drop-shadow(0 0 4px #00f5ff); }
        100% { filter: drop-shadow(0 0 14px #00f5ff); }
      }

      .meta-text {
        font-family: 'Fira Code', monospace;
        font-size: 8.5px;
        fill: rgba(0, 245, 255, 0.75);
        letter-spacing: 2px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Dark Card Base -->
  <rect x="15" y="15" width="330" height="420" rx="16" fill="url(#bgGrad)" stroke="#00f5ff" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Animated Matrix Digital Rain Columns in Background -->
  <g class="matrix-stream-1">
    <text x="35" y="20" class="matrix-char">1</text>
    <text x="35" y="38" class="matrix-char">0</text>
    <text x="35" y="56" class="matrix-char">&lt;</text>
    <text x="35" y="74" class="matrix-char">&gt;</text>
    <text x="35" y="92" class="matrix-char">A</text>
    <text x="35" y="110" class="matrix-char">I</text>
  </g>
  <g class="matrix-stream-2">
    <text x="60" y="30" class="matrix-char">0</text>
    <text x="60" y="48" class="matrix-char">1</text>
    <text x="60" y="66" class="matrix-char">{</text>
    <text x="60" y="84" class="matrix-char">}</text>
    <text x="60" y="102" class="matrix-char">F</text>
    <text x="60" y="120" class="matrix-char">7</text>
  </g>
  <g class="matrix-stream-3">
    <text x="295" y="25" class="matrix-char">M</text>
    <text x="295" y="43" class="matrix-char">L</text>
    <text x="295" y="61" class="matrix-char">1</text>
    <text x="295" y="79" class="matrix-char">0</text>
    <text x="295" y="97" class="matrix-char">1</text>
  </g>
  <g class="matrix-stream-4">
    <text x="320" y="40" class="matrix-char">&gt;</text>
    <text x="320" y="58" class="matrix-char">_</text>
    <text x="320" y="76" class="matrix-char">0</text>
    <text x="320" y="94" class="matrix-char">1</text>
  </g>

  <!-- Halftone Dot-Matrix Developer Portrait Silhouette -->
  <!-- Hair & Head Contour -->
  <g fill="#00f5ff" filter="url(#neonCyan)">
    <!-- Head Top / Hair -->
    <circle cx="180" cy="85" r="4.5" />
    <circle cx="165" cy="92" r="5" fill="#f59e0b" />
    <circle cx="195" cy="92" r="5" />
    <circle cx="150" cy="105" r="5.5" fill="#f59e0b" />
    <circle cx="210" cy="105" r="5.5" />
    <circle cx="138" cy="120" r="5" fill="#f59e0b" />
    <circle cx="222" cy="120" r="5" />
    
    <!-- Face / Beard & Glasses Accent -->
    <circle cx="165" cy="145" r="4.5" fill="#f59e0b" />
    <circle cx="195" cy="145" r="4.5" />
    <circle cx="155" cy="170" r="4" fill="#f59e0b" />
    <circle cx="178" cy="172" r="4" />
    <circle cx="205" cy="170" r="4" />
    <circle cx="180" cy="195" r="4.5" fill="#f59e0b" />
    <circle cx="168" cy="215" r="4" fill="#f59e0b" />
    <circle cx="192" cy="215" r="4" />
    
    <!-- Neck & Collar -->
    <circle cx="170" cy="245" r="5" fill="#f59e0b" />
    <circle cx="190" cy="245" r="5" />
    <circle cx="155" cy="265" r="5.5" fill="#f59e0b" />
    <circle cx="180" cy="268" r="5.5" />
    <circle cx="205" cy="265" r="5.5" />

    <!-- Shoulders & Jacket Grid -->
    <circle cx="135" cy="285" r="6" fill="#f59e0b" />
    <circle cx="160" cy="290" r="6" />
    <circle cx="180" cy="295" r="6" />
    <circle cx="200" cy="290" r="6" />
    <circle cx="225" cy="285" r="6" />

    <circle cx="115" cy="315" r="6.5" fill="#f59e0b" />
    <circle cx="145" cy="320" r="6.5" fill="#f59e0b" />
    <circle cx="180" cy="325" r="6.5" />
    <circle cx="215" cy="320" r="6.5" />
    <circle cx="245" cy="315" r="6.5" />

    <circle cx="95" cy="355" r="7" fill="#f59e0b" />
    <circle cx="130" cy="360" r="7" fill="#f59e0b" />
    <circle cx="180" cy="365" r="7" />
    <circle cx="230" cy="360" r="7" />
    <circle cx="265" cy="355" r="7" />
  </g>

  <!-- Circuit Lines & Crosshairs -->
  <path d="M 45 180 L 95 180 L 115 200" stroke="#00f5ff" stroke-width="1.2" stroke-opacity="0.5" fill="none" />
  <path d="M 315 160 L 265 160 L 245 140" stroke="#00f5ff" stroke-width="1.2" stroke-opacity="0.5" fill="none" />
  
  <circle cx="45" cy="180" r="2.5" fill="#00f5ff" />
  <circle cx="315" cy="160" r="2.5" fill="#00f5ff" />

  <!-- Animated Cyan Laser Scanline -->
  <g class="scanline">
    <line x1="25" y1="0" x2="335" y2="0" stroke="url(#scanlineGrad)" stroke-width="3" filter="url(#laserGlow)" />
  </g>

  <!-- Vertical Metadata Text Overlay -->
  <g class="meta-text" transform="translate(250, 45)">
    <text x="0" y="0">IDEAS</text>
    <text x="0" y="14">CODE</text>
    <text x="0" y="28">IMPACT</text>
    <text x="0" y="44" fill="#00f5ff" font-size="11px">/ ∞</text>
  </g>

  <g class="meta-text" transform="translate(240, 395)" fill="rgba(255,255,255,0.45)">
    <text x="0" y="0">A BETTER</text>
    <text x="0" y="12">TOMORROW</text>
    <text x="0" y="24">IS A COMMIT</text>
    <text x="0" y="36">AWAY...</text>
  </g>

  <!-- Glowing Neon Signature -->
  <text x="210" y="340" class="neon-sig" transform="rotate(-10, 210, 340)">Soumya</text>
</svg>
