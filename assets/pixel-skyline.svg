<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02050f" />
      <stop offset="60%" stop-color="#07132e" />
      <stop offset="100%" stop-color="#02050e" />
    </linearGradient>

    <linearGradient id="mountFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091d3e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020612" stop-opacity="0.98" />
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .star-twinkle-1 { animation: twinkle 1.5s infinite alternate; }
      .star-twinkle-2 { animation: twinkle 2.3s infinite alternate; animation-delay: 0.4s; }
      .star-twinkle-3 { animation: twinkle 3.1s infinite alternate; animation-delay: 0.9s; }

      @keyframes twinkle {
        0% { opacity: 0.2; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1.3); }
      }

      .shooting-star {
        stroke: #38bdf8;
        stroke-width: 2;
        stroke-linecap: round;
        filter: url(#strongGlow);
        animation: shoot 5s linear infinite;
      }

      @keyframes shoot {
        0% { transform: translate(-100px, -50px); opacity: 0; }
        5% { opacity: 1; }
        15% { transform: translate(650px, 200px); opacity: 0; }
        100% { transform: translate(650px, 200px); opacity: 0; }
      }

      .cursor {
        animation: blinkCursor 1s step-start infinite;
      }

      @keyframes blinkCursor {
        50% { opacity: 0; }
      }

      .pixel-quote {
        font-family: 'Fira Code', monospace, Courier;
        font-size: 15px;
        fill: #f1f5f9;
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      .step-text {
        font-family: 'Fira Code', monospace;
        font-size: 12.5px;
        fill: #38bdf8;
        letter-spacing: 1.5px;
        line-height: 1.6;
      }
    </style>
  </defs>

  <!-- Sky Background -->
  <rect width="900" height="320" rx="14" fill="url(#skyGrad)" stroke="#00f5ff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Twinkling Starfield -->
  <g fill="#67e8f9">
    <rect class="star-twinkle-1" x="65" y="45" width="2" height="2" />
    <rect class="star-twinkle-2" x="120" y="85" width="3" height="3" />
    <rect class="star-twinkle-3" x="180" y="35" width="2" height="2" />
    <rect class="star-twinkle-1" x="250" y="70" width="2.5" height="2.5" />
    <rect class="star-twinkle-2" x="310" y="40" width="2" height="2" />
    <rect class="star-twinkle-3" x="380" y="90" width="3" height="3" />
    <rect class="star-twinkle-1" x="430" y="30" width="2" height="2" />
    <rect class="star-twinkle-2" x="510" y="75" width="2" height="2" />
    <rect class="star-twinkle-3" x="590" y="50" width="3" height="3" />
    <rect class="star-twinkle-1" x="640" y="95" width="2" height="2" />
    <rect class="star-twinkle-2" x="780" y="65" width="2.5" height="2.5" />
    <rect class="star-twinkle-3" x="840" y="40" width="2" height="2" />
    <rect class="star-twinkle-1" x="730" y="110" width="2" height="2" />
  </g>

  <!-- Animated Shooting Star -->
  <line class="shooting-star" x1="120" y1="20" x2="60" y2="0" />

  <!-- Pixel Crescent Moon (Top Right) -->
  <g fill="#00f5ff" filter="url(#cyanGlow)" transform="translate(620, 40)">
    <rect x="18" y="0" width="6" height="6" />
    <rect x="24" y="6" width="6" height="6" />
    <rect x="30" y="12" width="6" height="12" />
    <rect x="30" y="24" width="6" height="12" />
    <rect x="24" y="36" width="6" height="6" />
    <rect x="18" y="42" width="6" height="6" />
    <rect x="12" y="45" width="6" height="6" />
  </g>

  <!-- Back Mountain Wireframe Layer -->
  <path d="M 0 320 L 0 210 L 80 170 L 170 230 L 260 160 L 370 240 L 490 150 L 610 235 L 720 165 L 820 220 L 900 180 L 900 320 Z" 
        fill="none" stroke="rgba(0, 245, 255, 0.3)" stroke-width="1.5" />

  <!-- Front Sharp Neon Mountain Wireframe with Gradient Fill -->
  <path d="M 0 320 L 0 250 L 90 200 L 165 240 L 240 180 L 320 255 L 430 190 L 530 260 L 630 195 L 740 250 L 830 190 L 900 240 L 900 320 Z" 
        fill="url(#mountFront)" stroke="#00f5ff" stroke-width="2" filter="url(#cyanGlow)" />

  <!-- Stargazer Pixel Silhouette (Sitting on the mountain peak at x=240, y=180) -->
  <g fill="#00f5ff" filter="url(#cyanGlow)">
    <!-- Head -->
    <rect x="237" y="156" width="7" height="7" />
    <!-- Torso -->
    <rect x="234" y="163" width="13" height="12" />
    <!-- Legs / Knees bent -->
    <rect x="231" y="175" width="18" height="6" />
  </g>

  <!-- Center Inspiring Philosophy Quote Box -->
  <g transform="translate(450, 75)">
    <rect x="-190" y="-22" width="380" height="42" rx="6" fill="#040711" fill-opacity="0.8" stroke="#00f5ff" stroke-opacity="0.3" stroke-width="1" />
    <text text-anchor="middle" y="5" class="pixel-quote">“Building a better tomorrow, one commit at a time.”</text>
  </g>

  <!-- Vertical Philosophy Steps (Right Box) -->
  <g transform="translate(740, 95)" class="step-text">
    <rect x="-15" y="-18" width="130" height="115" rx="6" fill="#040711" fill-opacity="0.8" stroke="#00f5ff" stroke-opacity="0.3" stroke-width="1" />
    <text x="0" y="0">&gt; CODE</text>
    <text x="0" y="20">&gt; LEARN</text>
    <text x="0" y="40">&gt; BUILD</text>
    <text x="0" y="60">&gt; IMPACT</text>
    <text x="0" y="80">&gt; REPEAT</text>
  </g>

  <!-- Bottom Terminal Echo Pill -->
  <g transform="translate(450, 285)">
    <rect x="-260" y="-16" width="520" height="32" rx="16" fill="#040711" fill-opacity="0.9" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1" />
    <text text-anchor="middle" y="5" font-family="'Fira Code', monospace" font-size="12.5px" fill="#e2e8f0">
      <tspan fill="#00f5ff" font-weight="bold">&gt; </tspan>
      Thanks for visiting! Let's build something amazing together. 
      <tspan class="cursor" fill="#00f5ff">█</tspan>
    </text>
  </g>
</svg>
