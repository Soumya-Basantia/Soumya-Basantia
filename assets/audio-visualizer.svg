<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 70" width="100%" height="70" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .bar {
        transform-origin: bottom;
        animation: bounce 1.2s ease-in-out infinite alternate;
        rx: 3px;
      }
      .b1 { animation-delay: 0.1s; animation-duration: 0.8s; }
      .b2 { animation-delay: 0.4s; animation-duration: 1.1s; }
      .b3 { animation-delay: 0.2s; animation-duration: 0.7s; }
      .b4 { animation-delay: 0.6s; animation-duration: 1.3s; }
      .b5 { animation-delay: 0.3s; animation-duration: 0.9s; }
      .b6 { animation-delay: 0.7s; animation-duration: 1.2s; }
      .b7 { animation-delay: 0.15s; animation-duration: 0.75s; }
      .b8 { animation-delay: 0.5s; animation-duration: 1.05s; }
      .b9 { animation-delay: 0.25s; animation-duration: 0.85s; }
      .b10 { animation-delay: 0.65s; animation-duration: 1.25s; }
      .b11 { animation-delay: 0.35s; animation-duration: 0.95s; }
      .b12 { animation-delay: 0.8s; animation-duration: 1.4s; }
      .b13 { animation-delay: 0.12s; animation-duration: 0.78s; }
      .b14 { animation-delay: 0.45s; animation-duration: 1.15s; }
      .b15 { animation-delay: 0.22s; animation-duration: 0.82s; }
      .b16 { animation-delay: 0.58s; animation-duration: 1.22s; }
      .b17 { animation-delay: 0.32s; animation-duration: 0.92s; }
      .b18 { animation-delay: 0.72s; animation-duration: 1.32s; }
      .b19 { animation-delay: 0.18s; animation-duration: 0.72s; }
      .b20 { animation-delay: 0.48s; animation-duration: 1.08s; }

      @keyframes bounce {
        0% { transform: scaleY(0.18); }
        50% { transform: scaleY(0.95); }
        100% { transform: scaleY(0.35); }
      }

      .pulse-line {
        stroke: #00f5ff;
        stroke-width: 2;
        fill: none;
        filter: url(#neonGlow);
        stroke-dasharray: 600;
        stroke-dashoffset: 600;
        animation: drawLine 3s linear infinite;
      }

      @keyframes drawLine {
        0% { stroke-dashoffset: 600; opacity: 0.4; }
        50% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: -600; opacity: 0.4; }
      }

      .text-quote {
        font-family: 'Fira Code', monospace, Courier;
        font-size: 13px;
        fill: #7dd3fc;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <rect width="480" height="70" rx="10" fill="#060913" stroke="#00f5ff" stroke-opacity="0.25" stroke-width="1" />

  <!-- Animated Soundwave Equalizer Bars -->
  <g transform="translate(25, 55)" fill="url(#cyanGrad)" filter="url(#neonGlow)">
    <rect class="bar b1" x="0" y="-45" width="4" height="45" />
    <rect class="bar b2" x="7" y="-45" width="4" height="45" />
    <rect class="bar b3" x="14" y="-45" width="4" height="45" />
    <rect class="bar b4" x="21" y="-45" width="4" height="45" />
    <rect class="bar b5" x="28" y="-45" width="4" height="45" />
    <rect class="bar b6" x="35" y="-45" width="4" height="45" />
    <rect class="bar b7" x="42" y="-45" width="4" height="45" />
    <rect class="bar b8" x="49" y="-45" width="4" height="45" />
    <rect class="bar b9" x="56" y="-45" width="4" height="45" />
    <rect class="bar b10" x="63" y="-45" width="4" height="45" />
    <rect class="bar b11" x="70" y="-45" width="4" height="45" />
    <rect class="bar b12" x="77" y="-45" width="4" height="45" />
    <rect class="bar b13" x="84" y="-45" width="4" height="45" />
    <rect class="bar b14" x="91" y="-45" width="4" height="45" />
    <rect class="bar b15" x="98" y="-45" width="4" height="45" />
    <rect class="bar b16" x="105" y="-45" width="4" height="45" />
    <rect class="bar b17" x="112" y="-45" width="4" height="45" />
    <rect class="bar b18" x="119" y="-45" width="4" height="45" />
    <rect class="bar b19" x="126" y="-45" width="4" height="45" />
    <rect class="bar b20" x="133" y="-45" width="4" height="45" />
  </g>

  <!-- Quote & Audio Status -->
  <g transform="translate(180, 40)">
    <text class="text-quote">“Learn. Build. Experiment. Improve. Repeat.”</text>
  </g>
</svg>
