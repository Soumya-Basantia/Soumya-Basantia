<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="100%" height="300" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .t-btn-close { fill: #ff5f56; }
      .t-btn-min { fill: #ffbd2e; }
      .t-btn-max { fill: #27c93f; }
      
      .t-title {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        fill: #64748b;
      }

      .code-line {
        font-family: 'Fira Code', monospace, Courier;
        font-size: 11.5px;
        line-height: 1.5;
      }

      .user { fill: #00ff88; font-weight: 600; }
      .host { fill: #38bdf8; }
      .prompt { fill: #94a3b8; }
      .cmd { fill: #ffffff; font-weight: bold; }
      .brace { fill: #cbd5e1; }
      .key { fill: #00f5ff; }
      .colon { fill: #94a3b8; }
      .str { fill: #fde047; }
      
      .cursor-blink {
        fill: #00f5ff;
        animation: blink 1s step-start infinite;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      .fade-in-1 { animation: fadeIn 0.4s ease forwards; animation-delay: 0.2s; opacity: 0; }
      .fade-in-2 { animation: fadeIn 0.4s ease forwards; animation-delay: 0.5s; opacity: 0; }
      .fade-in-3 { animation: fadeIn 0.4s ease forwards; animation-delay: 0.8s; opacity: 0; }
      .fade-in-4 { animation: fadeIn 0.4s ease forwards; animation-delay: 1.1s; opacity: 0; }
      .fade-in-5 { animation: fadeIn 0.4s ease forwards; animation-delay: 1.4s; opacity: 0; }
      .fade-in-6 { animation: fadeIn 0.4s ease forwards; animation-delay: 1.7s; opacity: 0; }
      .fade-in-7 { animation: fadeIn 0.4s ease forwards; animation-delay: 2.0s; opacity: 0; }

      @keyframes fadeIn {
        to { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Terminal Window Body -->
  <rect width="450" height="300" rx="12" fill="#080d1a" stroke="#00f5ff" stroke-opacity="0.25" stroke-width="1.2" />

  <!-- Terminal Title Bar -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 438 0 C 444.63 0 450 5.37 450 12 L 450 34 L 0 34 Z" fill="#0e1628" />
  <line x1="0" y1="34" x2="450" y2="34" stroke="rgba(0, 245, 255, 0.15)" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="20" cy="17" r="5" class="t-btn-close" />
  <circle cx="36" cy="17" r="5" class="t-btn-min" />
  <circle cx="52" cy="17" r="5" class="t-btn-max" />

  <text x="225" y="21" text-anchor="middle" class="t-title">bash — 80x24</text>

  <!-- Terminal Code Content -->
  <g class="code-line" transform="translate(20, 60)">
    <!-- Line 1: whoami -->
    <text x="0" y="0">
      <tspan class="user">soumya@developer</tspan><tspan class="prompt">:</tspan><tspan class="host">~</tspan><tspan class="prompt">$ </tspan><tspan class="cmd">whoami</tspan>
    </text>

    <!-- Line 2: { -->
    <g class="fade-in-1">
      <text x="0" y="22" class="brace">{</text>
    </g>

    <!-- Line 3: name -->
    <g class="fade-in-2">
      <text x="16" y="42">
        <tspan class="key">"name"</tspan><tspan class="colon">: </tspan><tspan class="str">"Soumya Basantia"</tspan><tspan class="brace">,</tspan>
      </text>
    </g>

    <!-- Line 4: role -->
    <g class="fade-in-3">
      <text x="16" y="62">
        <tspan class="key">"role"</tspan><tspan class="colon">: </tspan><tspan class="str">"AI/ML Engineering Student"</tspan><tspan class="brace">,</tspan>
      </text>
    </g>

    <!-- Line 5: focus -->
    <g class="fade-in-4">
      <text x="16" y="82">
        <tspan class="key">"focus"</tspan><tspan class="colon">: [</tspan><tspan class="str">"AI"</tspan><tspan class="brace">, </tspan><tspan class="str">"Computer Vision"</tspan><tspan class="brace">, </tspan><tspan class="str">"Full Stack"</tspan><tspan class="colon">],</tspan>
      </text>
    </g>

    <!-- Line 6: current_status -->
    <g class="fade-in-5">
      <text x="16" y="102">
        <tspan class="key">"current_status"</tspan><tspan class="colon">: </tspan><tspan class="str">"Building..."</tspan><tspan class="brace">,</tspan>
      </text>
    </g>

    <!-- Line 7: goal -->
    <g class="fade-in-6">
      <text x="16" y="122">
        <tspan class="key">"goal"</tspan><tspan class="colon">: </tspan><tspan class="str">"Create real-world impact"</tspan><tspan class="brace">,</tspan>
      </text>
    </g>

    <!-- Line 8: fun_fact -->
    <g class="fade-in-7">
      <text x="16" y="142">
        <tspan class="key">"fun_fact"</tspan><tspan class="colon">: </tspan><tspan class="str">"Ideas &gt; Overthinking"</tspan>
      </text>
      <text x="0" y="162" class="brace">}</text>
    </g>

    <!-- Line 9: Live terminal prompt with blinking cursor -->
    <text x="0" y="195">
      <tspan class="user">soumya@developer</tspan><tspan class="prompt">:</tspan><tspan class="host">~</tspan><tspan class="prompt">$ </tspan><tspan class="cursor-blink">█</tspan>
    </text>
  </g>
</svg>
